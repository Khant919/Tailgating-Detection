name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dlib-bin publishes wheels up to 3.13; face_recognition is optional at
        # runtime, so the suite must pass without it too.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # OpenCV needs libGL; zbar backs the optional QR scanner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libzbar0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "opencv-python>=4.7.0,<5" numpy flask Flask-Limiter requests PyJWT "qrcode[pil]"

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
